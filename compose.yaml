name: nextgame-g0
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:init}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: nextgame-minio:2025-10-15
    build:
      context: .
      dockerfile: dev/minio.Dockerfile
    command: server /data --console-address :9001
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run pnpm env:init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm env:init}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
  minio-data:
